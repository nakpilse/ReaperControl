<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>REAPER MIDI Controller</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Touch MIDI controller for REAPER">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script type="text/babel">
const { useState, useEffect, useRef, useReducer, useCallback } = React;

const FILE_NAME = "reaper-midi-layout.json";
const LS_KEY = "reaper-midi-layout";
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteName = n => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const uid = () => Math.random().toString(36).slice(2, 9);

// Block colours (keys kept compatible with earlier saved layouts)
const COLORS = {
  pad: "#8A929B", sand: "#F5A623", rose: "#E8504A", mint: "#3FC57A",
  sky: "#3A9BE8", lilac: "#9B6BE8", cyan: "#3ECFD6", orange: "#F07F3C",
};

// Standard gamepad mapping (GPD Win 4 in gamepad mode)
const GP_BUTTONS = ["A","B","X","Y","LB","RB","LT","RT","View","Menu","LS","RS","Up","Down","Left","Right"];
const GP_AXES = ["LX","LY","RX","RY","LT","RT"];

const btn = (o) => ({ id: uid(), label: "New", type: "note", num: 60, value: "", off: 0, mode: "momentary",
                      channel: 0, color: "pad", key: "", gamepad: "", ...o });
const fdr = (o) => ({ id: uid(), label: "Knob", type: "cc", cc: 1, value: 0, channel: 0, axis: "", invert: false, color: "sand", ...o });

// Resolves a button against its page's (then its section's) MIDI output/channel
// defaults — the button's own channel, if set, wins over both; a page's own
// output/channel, if set, wins over its section's.
const pageFor = (s, b) => (s.pages && (s.pages.find(p => p.id === b.pageId) || s.pages[0])) || null;
const effItem = (s, b) => {
  const p = pageFor(s, b);
  return { ...b,
    channel: b.channel || (p && p.channel) || s.channel || 0,
    outputName: (p && p.outputName) || s.outputName || "" };
};

// A section with no pages (or an item whose page no longer exists) falls back to
// its first page — keeps older saved layouts (from before pad tabs existed) working.
const pageOf = s => (s.pages && s.pages.find(p => p.id === s.activePage)) || (s.pages && s.pages[0]) || null;
const itemsOnPage = s => { const p = pageOf(s); return p ? s.items.filter(b => (b.pageId || (s.pages[0] && s.pages[0].id)) === p.id) : s.items; };

// Helix Native MIDI implementation (Line 6 Helix MIDI/OSC reference): Program
// Change selects presets 1:1 (PC 0 = preset 1, etc). CC#69 (values 0-7) selects
// Snapshots 1-8 — this is Helix's fixed/global snapshot controller, not
// something you need to MIDI-learn. CC#64 is Tap Tempo (any value >=64 taps).
// Per-footswitch/stomp CCs are user-assignable in Helix Native itself, so they
// aren't included here — add them with "Add button" once you've set them up
// in Helix's Command Center. Offered as an optional preset tab, not a forced
// default, via "Add Helix Native tab".
function makeHelixPage() {
  const page = { id: uid(), title: "Helix Native", outputName: "", channel: 0 };
  const items = [
    ...Array.from({ length: 8 }, (_, i) => btn({ label: "Preset " + (i + 1), type: "pc", num: i, color: "sky", pageId: page.id })),
    ...Array.from({ length: 8 }, (_, i) => btn({ label: "Snapshot " + (i + 1), type: "cc", num: 69, value: i, off: i, mode: "trigger", color: "mint", pageId: page.id })),
    btn({ label: "Tap Tempo", type: "cc", num: 64, value: 127, mode: "trigger", color: "sand", pageId: page.id }),
  ];
  return { page, items };
}

function makeDefault() {
  const padKeys = ["a","s","d","f","g","h","j","k","q","w","e","r","t","y","u","i"];
  const padPad = { 36: "A", 38: "B", 42: "X", 46: "Y", 49: "LB", 51: "RB" };
  const padColor = n => n === 36 ? "rose" : n === 38 ? "sand" : n === 42 || n === 46 ? "cyan" : n >= 49 ? "lilac" : "sky";
  const transportPage = { id: uid(), title: "1", outputName: "", channel: 0 };
  const padsPage = { id: uid(), title: "1", outputName: "", channel: 0 };
  return {
    version: 2,
    settings: { name: "REAPER Control", outputName: "", channel: 1, velocity: 100 },
    faderGroup: { outputName: "", channel: 0 },
    sections: [
      { id: uid(), title: "Transport", cols: 6, outputName: "", channel: 0,
        pages: [transportPage], activePage: transportPage.id, items: [
        btn({ label: "Play",   type: "cc", num: 20, value: 127, mode: "trigger", color: "mint", key: "space", gamepad: "Menu", pageId: transportPage.id }),
        btn({ label: "Stop",   type: "cc", num: 21, value: 127, mode: "trigger", gamepad: "View", pageId: transportPage.id }),
        btn({ label: "Record", type: "cc", num: 22, value: 127, mode: "trigger", color: "rose", pageId: transportPage.id }),
        btn({ label: "Rewind", type: "cc", num: 23, value: 127, mode: "trigger", gamepad: "Left", pageId: transportPage.id }),
        btn({ label: "Loop",   type: "cc", num: 24, value: 127, mode: "trigger", color: "sky", pageId: transportPage.id }),
        btn({ label: "Undo",   type: "cc", num: 25, value: 127, mode: "trigger", color: "orange", pageId: transportPage.id }),
      ]},
      { id: uid(), title: "Pads", cols: 8, outputName: "", channel: 0,
        pages: [padsPage], activePage: padsPage.id, items: [
        ...Array.from({ length: 8 }, (_, i) => 44 + i),
        ...Array.from({ length: 8 }, (_, i) => 36 + i),
      ].map(n => btn({ label: noteName(n), num: n, color: padColor(n), key: padKeys[n - 36] || "", gamepad: padPad[n] || "", pageId: padsPage.id })) },
    ],
    faders: [
      fdr({ label: "Volume", cc: 7, value: 100, color: "sand" }),
      fdr({ label: "Pan", cc: 10, value: 64, axis: "LX", color: "sky" }),
      fdr({ label: "Mod", cc: 1, value: 0, axis: "RT", color: "lilac" }),
      fdr({ label: "Expression", cc: 11, value: 127, color: "mint" }),
      fdr({ label: "Cutoff", cc: 74, value: 64, axis: "RX", color: "orange" }),
      fdr({ label: "Pitch bend", type: "pb", value: 8192, axis: "LY", color: "cyan" }),
    ],
  };
}

// --- tiny IndexedDB store for the folder handle ---
const idb = (() => {
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open("reaper-midi", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction("kv", mode); const req = fn(t.objectStore("kv"));
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); };
  return { get: k => tx("readonly", s => s.get(k)), set: (k, v) => tx("readwrite", s => s.put(v, k)), del: k => tx("readwrite", s => s.delete(k)) };
})();

const validConfig = c => c && Array.isArray(c.sections) && Array.isArray(c.faders) && c.settings;

// ================= App =================
function App() {
  const [config, setConfig] = useState(() => {
    try { const c = JSON.parse(localStorage.getItem(LS_KEY)); if (validConfig(c)) return c; } catch {}
    return makeDefault();
  });
  const [outputs, setOutputs] = useState([]);
  const [midiErr, setMidiErr] = useState("");
  const [last, setLast] = useState("Ready");
  const [edit, setEdit] = useState(false);
  const [sel, setSel] = useState(null);
  const [folder, setFolder] = useState(null);
  const [folderState, setFolderState] = useState("none"); // none | prompt | connected
  const [saveMsg, setSaveMsg] = useState("");
  const [gpName, setGpName] = useState("");
  const [isFull, setIsFull] = useState(false);
  const [, force] = useReducer(x => x + 1, 0);

  const activeRef = useRef({});
  const cfgRef = useRef(config); cfgRef.current = config;
  const editRef = useRef(edit); editRef.current = edit;
  const importRef = useRef(null);

  const update = useCallback(fn => setConfig(c => { const d = structuredClone(c); fn(d); return d; }), []);

  // ---------- MIDI ----------
  useEffect(() => {
    if (!navigator.requestMIDIAccess) { setMidiErr("Web MIDI needs Chrome or Edge"); return; }
    navigator.requestMIDIAccess().then(acc => {
      const refresh = () => setOutputs([...acc.outputs.values()]);
      refresh(); acc.onstatechange = refresh;
    }).catch(e => setMidiErr("MIDI blocked: " + e.message));
  }, []);

  const output = outputs.find(o => o.name === config.settings.outputName)
    || outputs.find(o => /loop|iac|virtual/i.test(o.name)) || outputs[0] || null;
  const outRef = useRef(output); outRef.current = output;

  // Resolves a section/knob-group's chosen output name to a live MIDI output,
  // falling back to the global default (top bar) when unset or disconnected.
  const pickOutput = useCallback(name => (name && outputs.find(o => o.name === name)) || outRef.current, [outputs]);

  const sendRaw = useCallback((outObj, bytes, desc) => {
    if (!outObj) { setLast("No MIDI output — " + desc); return; }
    outObj.send(bytes);
    setLast(desc + "   " + bytes.map(b => b.toString(16).padStart(2, "0").toUpperCase()).join(" "));
  }, []);

  const chOf = (item, groupChannel) => ((item.channel || groupChannel || cfgRef.current.settings.channel) - 1) & 15;

  const sendOn = (b) => {
    const out = pickOutput(b.outputName); const ch = chOf(b);
    if (b.type === "note") { const v = b.value === "" ? cfgRef.current.settings.velocity : +b.value;
      sendRaw(out, [0x90 | ch, b.num, clamp(v, 1, 127)], `Ch ${ch + 1}  Note On ${noteName(b.num)}  vel ${v}`); }
    else if (b.type === "cc") { const v = b.value === "" ? 127 : +b.value; sendRaw(out, [0xB0 | ch, b.num, v], `Ch ${ch + 1}  CC ${b.num} = ${v}`); }
    else if (b.type === "pc") sendRaw(out, [0xC0 | ch, b.num], `Ch ${ch + 1}  Program ${b.num}`);
  };
  const sendOff = (b) => {
    const out = pickOutput(b.outputName); const ch = chOf(b);
    if (b.type === "note") sendRaw(out, [0x80 | ch, b.num, 0], `Ch ${ch + 1}  Note Off ${noteName(b.num)}`);
    else if (b.type === "cc") sendRaw(out, [0xB0 | ch, b.num, +b.off || 0], `Ch ${ch + 1}  CC ${b.num} = ${+b.off || 0}`);
  };
  const setActive = (id, v) => { activeRef.current[id] = v; force(); };

  const press = (b) => {
    if (b.type === "pc") { sendOn(b); setActive(b.id, true); setTimeout(() => setActive(b.id, false), 120); return; }
    if (b.mode === "toggle") { const on = !activeRef.current[b.id]; on ? sendOn(b) : sendOff(b); setActive(b.id, on); return; }
    if (activeRef.current[b.id] && b.mode === "momentary") return;
    sendOn(b); setActive(b.id, true);
    if (b.mode === "trigger") setTimeout(() => { sendOff(b); setActive(b.id, false); }, b.type === "note" ? 120 : 40);
  };
  const release = (b) => {
    if (b.mode === "momentary" && b.type !== "pc" && activeRef.current[b.id]) { sendOff(b); setActive(b.id, false); }
  };
  const pressRef = useRef(press); pressRef.current = press;
  const releaseRef = useRef(release); releaseRef.current = release;

  const faderMax = f => f.type === "pb" ? 16383 : 127;
  const setFader = useCallback((id, v) => {
    const f = cfgRef.current.faders.find(x => x.id === id); if (!f || f.value === v) return;
    const grp = cfgRef.current.faderGroup || {};
    const out = pickOutput(grp.outputName); const ch = chOf(f, grp.channel);
    if (f.type === "pb") sendRaw(out, [0xE0 | ch, v & 0x7F, (v >> 7) & 0x7F], `Ch ${ch + 1}  Pitch Bend ${v - 8192}`);
    else sendRaw(out, [0xB0 | ch, f.cc, v], `Ch ${ch + 1}  CC ${f.cc} = ${v}`);
    update(d => { const x = d.faders.find(x => x.id === id); if (x) x.value = v; });
  }, [update, sendRaw, pickOutput]);
  const setFaderRef = useRef(setFader); setFaderRef.current = setFader;

  const panic = () => {
    const outs = new Set();
    if (outRef.current) outs.add(outRef.current);
    cfgRef.current.sections.forEach(s => { const o = pickOutput(s.outputName); if (o) outs.add(o); });
    const fg = cfgRef.current.faderGroup; const fo = pickOutput(fg && fg.outputName); if (fo) outs.add(fo);
    if (!outs.size) return;
    outs.forEach(o => { for (let c = 0; c < 16; c++) { o.send([0xB0 | c, 123, 0]); o.send([0xB0 | c, 120, 0]); } });
    activeRef.current = {}; force();
    setLast("Panic — All Notes Off and All Sound Off on 16 channels" + (outs.size > 1 ? ` across ${outs.size} outputs` : ""));
  };

  // ---------- saving ----------
  const writeFolder = async (h, cfg) => {
    const fh = await h.getFileHandle(FILE_NAME, { create: true });
    const w = await fh.createWritable(); await w.write(JSON.stringify(cfg, null, 2)); await w.close();
  };
  const readFolder = async (h) => {
    try { const fh = await h.getFileHandle(FILE_NAME); const c = JSON.parse(await (await fh.getFile()).text());
          return validConfig(c) ? c : null; } catch { return null; }
  };

  const save = async () => {
    const cfg = cfgRef.current;
    localStorage.setItem(LS_KEY, JSON.stringify(cfg));
    if (folder && folderState === "connected") {
      try { await writeFolder(folder, cfg); setSaveMsg("Saved to " + folder.name + "/" + FILE_NAME); }
      catch (e) { setSaveMsg("Folder save failed: " + e.message); }
    } else setSaveMsg("Saved in browser only — link a folder to save a file");
  };
  const saveRef = useRef(save); saveRef.current = save;

  // ---------- computer keyboard ----------
  useEffect(() => {
    const keyOf = e => e.key === " " ? "space" : e.key.toLowerCase();
    const all = () => cfgRef.current.sections.flatMap(s => itemsOnPage(s).map(b => effItem(s, b)));
    const down = e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveRef.current(); return; }
      if (editRef.current || e.target.closest("input,select,textarea")) return;
      const hits = all().filter(b => b.key && b.key === keyOf(e));
      if (!hits.length) return;
      e.preventDefault(); if (e.repeat) return;
      hits.forEach(b => pressRef.current(b));
    };
    const up = e => {
      if (editRef.current) return;
      all().filter(b => b.key && b.key === keyOf(e)).forEach(b => releaseRef.current(b));
    };
    window.addEventListener("keydown", down); window.addEventListener("keyup", up);
    return () => { window.removeEventListener("keydown", down); window.removeEventListener("keyup", up); };
  }, []);

  // ---------- gamepad (GPD Win 4 controls) ----------
  useEffect(() => {
    let raf; const prevBtn = []; const prevAxis = {}; let lastName = "";
    const loop = () => {
      const gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
      const name = gp ? gp.id : "";
      if (name !== lastName) { lastName = name; setGpName(name); }
      if (gp && !editRef.current) {
        const cfg = cfgRef.current; const all = cfg.sections.flatMap(s => itemsOnPage(s).map(b => effItem(s, b)));
        gp.buttons.forEach((b, i) => {
          const p = b.pressed; if (p === prevBtn[i]) return; prevBtn[i] = p;
          const label = GP_BUTTONS[i]; if (!label) return;
          all.filter(x => x.gamepad === label).forEach(x => p ? pressRef.current(x) : releaseRef.current(x));
        });
        cfg.faders.forEach(f => {
          if (!f.axis) return;
          const max = faderMax(f); let t;
          if (f.axis === "LT" || f.axis === "RT") { const b = gp.buttons[f.axis === "LT" ? 6 : 7]; if (!b) return; t = b.value; }
          else {
            let raw = gp.axes[{ LX: 0, LY: 1, RX: 2, RY: 3 }[f.axis]]; if (raw == null) return;
            if (Math.abs(raw) < 0.08) raw = 0;
            t = f.axis.endsWith("Y") ? (1 - raw) / 2 : (raw + 1) / 2;
          }
          if (f.invert) t = 1 - t;
          const v = Math.round(clamp(t, 0, 1) * max);
          if (prevAxis[f.id] !== v) { prevAxis[f.id] = v; setFaderRef.current(f.id, v); }
        });
      }
      raf = requestAnimationFrame(loop);
    };
    loop(); return () => cancelAnimationFrame(raf);
  }, []);

  // load folder handle on start
  useEffect(() => { (async () => {
    try {
      const h = await idb.get("dir"); if (!h) return;
      setFolder(h);
      if ((await h.queryPermission({ mode: "readwrite" })) === "granted") {
        const c = await readFolder(h); if (c) setConfig(c);
        setFolderState("connected"); setSaveMsg("Loaded from " + h.name);
      } else setFolderState("prompt");
    } catch {}
  })(); }, []);

  // autosave: browser immediately, folder after a pause
  useEffect(() => {
    localStorage.setItem(LS_KEY, JSON.stringify(config));
    if (!(folder && folderState === "connected")) return;
    setSaveMsg("Saving…");
    const t = setTimeout(() => writeFolder(folder, config)
      .then(() => setSaveMsg("Saved to " + folder.name))
      .catch(e => setSaveMsg("Folder save failed: " + e.message)), 700);
    return () => clearTimeout(t);
  }, [config, folder, folderState]);

  const linkFolder = async () => {
    if (!window.showDirectoryPicker) { alert("Folder saving needs Chrome or Edge. Use Export instead."); return; }
    try {
      const h = await window.showDirectoryPicker({ id: "reaper-midi", mode: "readwrite" });
      await idb.set("dir", h); setFolder(h);
      const existing = await readFolder(h);
      if (existing && confirm(`Found ${FILE_NAME} in "${h.name}". Load it?\n\nOK = load the file\nCancel = overwrite it with the current layout`)) setConfig(existing);
      else await writeFolder(h, cfgRef.current);
      setFolderState("connected"); setSaveMsg("Linked to " + h.name);
    } catch (e) { if (e.name !== "AbortError") setSaveMsg("Couldn't link folder: " + e.message); }
  };
  const reconnect = async () => {
    if ((await folder.requestPermission({ mode: "readwrite" })) !== "granted") return;
    const c = await readFolder(folder); if (c) setConfig(c);
    setFolderState("connected"); setSaveMsg("Reconnected to " + folder.name);
  };
  const unlink = async () => { await idb.del("dir"); setFolder(null); setFolderState("none"); setSaveMsg("Folder unlinked"); };

  // Save the current layout to the folder file, then reload the page from it
  const saveAndReload = async () => {
    const cfg = cfgRef.current;
    localStorage.setItem(LS_KEY, JSON.stringify(cfg));
    try {
      let h = folder;
      if (!h) {
        if (!window.showDirectoryPicker) { setSaveMsg("Saved in browser — reloading…"); setTimeout(() => location.reload(), 300); return; }
        h = await window.showDirectoryPicker({ id: "reaper-midi", mode: "readwrite" });
        await idb.set("dir", h);
      } else if ((await h.queryPermission({ mode: "readwrite" })) !== "granted"
              && (await h.requestPermission({ mode: "readwrite" })) !== "granted") {
        setSaveMsg("Saving to the folder wasn't allowed — nothing reloaded"); return;
      }
      setSaveMsg("Saving…");
      await writeFolder(h, cfg);
      setSaveMsg("Saved to " + h.name + "/" + FILE_NAME + " — reloading…");
      setTimeout(() => location.reload(), 400);
    } catch (e) {
      if (e.name !== "AbortError") setSaveMsg("Save failed, page not reloaded: " + e.message);
    }
  };

  const exportJson = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(config, null, 2)], { type: "application/json" }));
    a.download = FILE_NAME; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const importJson = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const c = JSON.parse(await f.text()); if (!validConfig(c)) throw new Error("not a layout file"); setConfig(c); setSaveMsg("Imported " + f.name); }
    catch (err) { alert("Import failed: " + err.message); }
    e.target.value = "";
  };

  // ---------- fullscreen ----------
  useEffect(() => { const h = () => setIsFull(!!document.fullscreenElement); document.addEventListener("fullscreenchange", h); return () => document.removeEventListener("fullscreenchange", h); }, []);
  const toggleFull = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen({ navigationUI: "hide" });

  // ---------- edit helpers ----------
  const findBtn = (d, id) => { for (const s of d.sections) { const i = s.items.findIndex(b => b.id === id); if (i >= 0) return { s, i }; } return null; };
  const addButton = (secId) => {
    const b = btn({});
    update(d => { const s = d.sections.find(x => x.id === secId); b.pageId = s.activePage; s.items.push(b); });
    setSel({ kind: "button", id: b.id });
  };
  const addSection = () => { const s = { id: uid(), title: "New section", cols: 4, outputName: "", channel: 0, items: [] }; update(d => d.sections.push(s)); setSel({ kind: "section", id: s.id }); };
  const addFader = () => { const f = fdr({}); update(d => d.faders.push(f)); setSel({ kind: "fader", id: f.id }); };
  const setS = (k, v) => update(d => { d.settings[k] = v; });

  // ---------- pad tabs (pages within a section) ----------
  const setPage = (secId, pageId) => update(d => { d.sections.find(s => s.id === secId).activePage = pageId; });
  // Migrates a legacy, un-paged section into a single page "1" holding all its
  // existing buttons — only happens the first time a section grows a second tab.
  const ensurePaged = s => {
    if (s.pages && s.pages.length) return;
    const p0 = { id: uid(), title: "1", outputName: "", channel: 0 };
    s.items.forEach(b => { b.pageId = p0.id; });
    s.pages = [p0]; s.activePage = p0.id;
  };
  const addPage = (secId) => update(d => {
    const s = d.sections.find(x => x.id === secId);
    ensurePaged(s);
    const np = { id: uid(), title: String(s.pages.length + 1), outputName: "", channel: 0 };
    s.pages.push(np); s.activePage = np.id;
  });
  const addHelixTab = (secId) => update(d => {
    const s = d.sections.find(x => x.id === secId);
    ensurePaged(s);
    const { page, items } = makeHelixPage();
    s.pages.push(page); s.items.push(...items); s.activePage = page.id;
  });
  const renamePage = (secId, pageId, title) => update(d => {
    d.sections.find(x => x.id === secId).pages.find(p => p.id === pageId).title = title;
  });
  const setPageField = (secId, pageId, key, val) => update(d => {
    d.sections.find(x => x.id === secId).pages.find(p => p.id === pageId)[key] = val;
  });
  const deletePage = (secId, pageId) => update(d => {
    const s = d.sections.find(x => x.id === secId); if (s.pages.length <= 1) return;
    s.items = s.items.filter(b => (b.pageId || s.pages[0].id) !== pageId);
    s.pages = s.pages.filter(p => p.id !== pageId);
    if (s.activePage === pageId) s.activePage = s.pages[0].id;
  });

  const status = midiErr ? "err" : output ? "on" : "";

  return (
    <div className={"app" + (edit ? " edit" : "")}>
      <header className="head">
        <div className="preset">
          <span className="name">{config.settings.name || "REAPER Control"}</span>
          <span className="route"><span className={"dot " + status}></span>{midiErr || (output ? output.name : "No MIDI output")}</span>
        </div>
        <select className="out" value={output ? output.name : ""} onChange={e => setS("outputName", e.target.value)} title="MIDI output">
          {outputs.length === 0 && <option value="">{midiErr || "No MIDI outputs"}</option>}
          {outputs.map(o => <option key={o.id} value={o.name}>{o.name}</option>)}
        </select>
        <select value={config.settings.channel} onChange={e => setS("channel", +e.target.value)} title="Global channel">
          {Array.from({ length: 16 }, (_, i) => <option key={i} value={i + 1}>Ch {i + 1}</option>)}
        </select>
        <input className="narrow" type="number" min="1" max="127" value={config.settings.velocity} title="Default velocity"
          onChange={e => setS("velocity", clamp(+e.target.value || 1, 1, 127))} />
        <div className="lcd">
          <span>{last}</span>
          {gpName && <span className="pad-ico" title={gpName}>🎮</span>}
        </div>
        <button className={"tb" + (edit ? " on" : "")} onClick={() => { setEdit(!edit); setSel(null); }}>{edit ? "Done" : "Edit"}</button>
        <button className="tb" onClick={toggleFull}>{isFull ? "Exit full" : "Fullscreen"}</button>
        <button className="tb danger" onClick={panic}>Panic</button>
      </header>

      {edit ? (
        <div className="tools">
          <button className="tb primary" onClick={saveAndReload} title="Write reaper-midi-layout.json, then reload">Save &amp; reload</button>
          <button className="tb" onClick={addSection}>Add section</button>
          <button className="tb" onClick={addFader}>Add knob</button>
          {folderState === "none" && <button className="tb" onClick={linkFolder}>Link save folder</button>}
          {folderState === "prompt" && <button className="tb on" onClick={reconnect}>Reconnect {folder && folder.name}</button>}
          {folderState === "connected" && <><button className="tb" onClick={save}>Save now</button><button className="tb" onClick={unlink}>Unlink folder</button></>}
          <button className="tb" onClick={exportJson}>Export</button>
          <button className="tb" onClick={() => importRef.current.click()}>Import</button>
          <button className="tb" onClick={() => { if (confirm("Reset to the default layout?")) { setConfig(makeDefault()); setSel(null); } }}>Reset</button>
          <span className="chip">{saveMsg}</span>
          <input ref={importRef} type="file" accept=".json,application/json" hidden onChange={importJson} />
        </div>
      ) : folderState === "prompt" ? (
        <div className="tools"><button className="tb primary" onClick={reconnect}>Reconnect save folder “{folder && folder.name}”</button>
          <span className="chip">The browser needs one click to allow saving again.</span></div>
      ) : <div></div>}

      <main className="deck">
        {config.sections.map(s => {
          const pageItems = itemsOnPage(s);
          const rows = s.rows || Math.max(1, Math.ceil(pageItems.length / s.cols));
          return (
            <div className="section" key={s.id} style={{ flex: `${rows} 1 0` }}>
              <div className="lane">
                <span className="tag">{s.title}</span>
                {s.pages && s.pages.length > 1 && s.pages.map(p => (
                  <button key={p.id} className={"tb" + (s.activePage === p.id ? " on" : "")} onClick={() => setPage(s.id, p.id)}>{p.title}</button>
                ))}
                {edit && <>
                  <button className={"tb" + (sel && sel.id === s.id ? " on" : "")} onClick={() => setSel({ kind: "section", id: s.id })}>Edit section</button>
                  <button className="tb" onClick={() => addButton(s.id)}>Add button</button>
                </>}
              </div>
              <div className="grid" style={{ gridTemplateColumns: `repeat(${s.cols}, 1fr)`, gridTemplateRows: `repeat(${rows}, 1fr)` }}>
                {pageItems.map(b => {
                  const eff = effItem(s, b);
                  return (
                    <PadButton key={b.id} b={b} lit={!!activeRef.current[b.id]} edit={edit}
                      selected={sel && sel.id === b.id}
                      onSelect={() => setSel({ kind: "button", id: b.id })}
                      onPress={() => press(eff)} onRelease={() => release(eff)} />
                  );
                })}
              </div>
            </div>
          );
        })}
      </main>

      <footer className="strip">
        {config.faders.map(f => (
          <Knob key={f.id} f={f} max={faderMax(f)} edit={edit} selected={sel && sel.id === f.id}
            onSelect={() => setSel({ kind: "fader", id: f.id })} onChange={v => setFader(f.id, v)} />
        ))}
        {edit && <>
          <button className={"tb" + (sel && sel.kind === "faderGroup" ? " on" : "")} onClick={() => setSel({ kind: "faderGroup" })}>Edit knobs</button>
          <button className="tb add-knob" onClick={addFader}>Add knob</button>
        </>}
      </footer>

      {edit && sel && <Editor sel={sel} config={config} update={update} findBtn={findBtn} close={() => setSel(null)} setSel={setSel} outputs={outputs}
        addPage={addPage} addHelixTab={addHelixTab} renamePage={renamePage} setPageField={setPageField} deletePage={deletePage} />}
      {edit && !sel && (
        <div className="drawer">
          <h3>Edit mode</h3>
          <Field label="Layout name"><input type="text" value={config.settings.name || ""} placeholder="REAPER Control"
            onChange={e => setS("name", e.target.value)} /></Field>
          <p className="help">Tap any block, knob or “Edit section” to change it. Changes save automatically
            {folderState === "connected"
              ? <> to <b>{folder.name}/{FILE_NAME}</b>.</>
              : <> in this browser. Use “Link save folder” and pick the folder this HTML file is in to keep the layout as a file next to it.</>}
          </p>
          <p className="help">Save &amp; reload writes the file and restarts the controller from it. Ctrl+S saves without reloading.</p>
          <p className="help">Gamepad bindings work when the GPD Win 4 is in gamepad mode. Press any controller button once so the browser detects it.</p>
        </div>
      )}
    </div>
  );
}

// ================= Controls =================
function PadButton({ b, lit, edit, selected, onSelect, onPress, onRelease }) {
  const meta = b.type === "note" ? `${noteName(b.num)}  ·  ${b.num}` : b.type === "cc" ? `CC ${b.num}` : `PC ${b.num}`;
  const binds = [b.key && (b.key === "space" ? "Space" : b.key.toUpperCase()), b.gamepad].filter(Boolean).join(" / ");
  return (
    <button className={"pad" + (lit ? " lit" : "") + (selected ? " sel" : "")} style={{ "--c": COLORS[b.color] || COLORS.pad }}
      onPointerDown={e => { if (edit) { onSelect(); return; } e.currentTarget.setPointerCapture(e.pointerId); onPress(); }}
      onPointerUp={() => !edit && onRelease()} onPointerCancel={() => !edit && onRelease()}
      onContextMenu={e => e.preventDefault()}>
      <span className="lbl">{b.label}</span>
      <span className="meta"><b>{meta}</b>{b.mode !== "momentary" && b.type !== "pc" ? "  ·  " + b.mode : ""}{binds && <><br />{binds}</>}</span>
    </button>
  );
}

// arc helpers for knobs (0° = top, clockwise)
const polar = (a, r) => { const rad = (a - 90) * Math.PI / 180; return [50 + r * Math.cos(rad), 50 + r * Math.sin(rad)]; };
const arc = (a0, a1, r) => {
  if (a1 < a0) [a0, a1] = [a1, a0];
  if (a1 - a0 < 0.5) a1 = a0 + 0.5;
  const [x0, y0] = polar(a0, r), [x1, y1] = polar(a1, r);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
};

function Knob({ f, max, edit, selected, onSelect, onChange }) {
  const drag = useRef(null);
  const c = COLORS[f.color] || COLORS.sand;
  const t = f.value / max;
  const ang = -135 + t * 270;
  const from = f.type === "pb" || f.cc === 10 ? 0 : -135;   // bipolar knobs fill from the centre
  const [px, py] = polar(ang, 27);
  const shown = f.type === "pb" ? f.value - 8192 : f.value;

  const down = e => {
    if (edit) { onSelect(); return; }
    e.currentTarget.setPointerCapture(e.pointerId);
    drag.current = { x: e.clientX, y: e.clientY, v: f.value };
  };
  const move = e => {
    const d = drag.current; if (!d) return;
    const delta = (d.y - e.clientY) + (e.clientX - d.x) * 0.6;   // up or right raises the value
    onChange(Math.round(clamp(d.v + (delta / 200) * max, 0, max)));
  };
  const up = () => { drag.current = null; if (f.type === "pb") onChange(8192); };

  return (
    <div className={"knob" + (selected ? " sel" : "")} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
      <span className="kname">{f.label}</span>
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
        <path d={arc(-135, 135, 40)} stroke="#33383E" strokeWidth="7" fill="none" strokeLinecap="round" />
        <path d={arc(from, ang, 40)} stroke={c} strokeWidth="7" fill="none" strokeLinecap="round"
              style={{ filter: `drop-shadow(0 0 4px ${c}88)` }} />
        <circle cx="50" cy="50" r="31" fill="#2B2F34" stroke="#3A3F45" strokeWidth="1.5" />
        <circle cx="50" cy="50" r="24" fill="#24282C" />
        <line x1="50" y1="50" x2={px} y2={py} stroke="#E6E9EC" strokeWidth="4" strokeLinecap="round" />
      </svg>
      <span className="kval">{shown}</span>
      <span className="ksub">{f.type === "pb" ? "Pitch bend" : "CC " + f.cc}{f.axis ? "  ·  " + f.axis : ""}</span>
    </div>
  );
}

// ================= Editor drawer =================
function Field({ label, children }) { return <label className="field">{label}{children}</label>; }
const num = (v, lo, hi) => clamp(parseInt(v, 10) || 0, lo, hi);

function ChannelSelect({ value, onChange, title }) {
  return (
    <select value={value} onChange={e => onChange(+e.target.value)} title={title || "Channel"}>
      <option value={0}>Global (top bar)</option>
      {Array.from({ length: 16 }, (_, i) => <option key={i} value={i + 1}>{i + 1}</option>)}
    </select>
  );
}
function OutputSelect({ value, outputs, onChange, title }) {
  const known = outputs.some(o => o.name === value);
  return (
    <select value={value || ""} onChange={e => onChange(e.target.value)} title={title || "MIDI output"}>
      <option value="">Global (top bar)</option>
      {!known && value && <option value={value}>{value} (offline)</option>}
      {outputs.map(o => <option key={o.id} value={o.name}>{o.name}</option>)}
    </select>
  );
}
function ModeSelect({ b, set }) {
  return (
    <select value={b.mode} onChange={e => set("mode", e.target.value)}>
      <option value="momentary">Momentary</option><option value="toggle">Toggle</option><option value="trigger">Trigger</option>
    </select>
  );
}
function Swatches({ value, onChange }) {
  return (
    <div className="swatches">{Object.entries(COLORS).map(([k, c]) =>
      <span key={k} className={"swatch" + (value === k ? " on" : "")} style={{ background: c }} onClick={() => onChange(k)} title={k}></span>)}</div>
  );
}

function Editor({ sel, config, update, findBtn, close, setSel, outputs, addPage, addHelixTab, renamePage, setPageField, deletePage }) {
  if (sel.kind === "button") {
    const loc = findBtn(config, sel.id); if (!loc) return null;
    const b = loc.s.items[loc.i];
    const set = (k, v) => update(d => { const l = findBtn(d, sel.id); l.s.items[l.i][k] = v; });
    const move = dir => update(d => { const l = findBtn(d, sel.id); const j = l.i + dir; if (j < 0 || j >= l.s.items.length) return;
      [l.s.items[l.i], l.s.items[j]] = [l.s.items[j], l.s.items[l.i]]; });
    const dup = () => { const id = uid(); update(d => { const l = findBtn(d, sel.id); l.s.items.splice(l.i + 1, 0, { ...l.s.items[l.i], id, key: "", gamepad: "" }); }); setSel({ kind: "button", id }); };
    const del = () => { update(d => { const l = findBtn(d, sel.id); l.s.items.splice(l.i, 1); }); close(); };
    const toSection = secId => update(d => { const l = findBtn(d, sel.id); const [it] = l.s.items.splice(l.i, 1); const target = d.sections.find(s => s.id === secId); it.pageId = target.activePage; target.items.push(it); });
    return (
      <div className="drawer">
        <h3>Block <button className="tb" onClick={close}>Close</button></h3>
        <Field label="Label"><input type="text" value={b.label} onChange={e => set("label", e.target.value)} /></Field>
        <div className="two">
          <Field label="Message">
            <select value={b.type} onChange={e => set("type", e.target.value)}>
              <option value="note">Note</option><option value="cc">Control change</option><option value="pc">Program change</option>
            </select>
          </Field>
          <Field label={b.type === "note" ? `Note (${noteName(b.num)})` : b.type === "cc" ? "CC number" : "Program"}>
            <input type="number" min="0" max="127" value={b.num} onChange={e => set("num", num(e.target.value, 0, 127))} />
          </Field>
        </div>
        {b.type !== "pc" && <div className="two">
          <Field label={b.type === "note" ? "Velocity (blank = default)" : "On value"}>
            <input type="number" min="0" max="127" value={b.value} placeholder={b.type === "note" ? "default" : "127"}
              onChange={e => set("value", e.target.value === "" ? "" : num(e.target.value, 0, 127))} />
          </Field>
          {b.type === "cc"
            ? <Field label="Off value"><input type="number" min="0" max="127" value={b.off} onChange={e => set("off", num(e.target.value, 0, 127))} /></Field>
            : <Field label="Mode"><ModeSelect b={b} set={set} /></Field>}
        </div>}
        {b.type === "cc" && <Field label="Mode"><ModeSelect b={b} set={set} /></Field>}
        <Field label="Channel"><ChannelSelect value={b.channel} onChange={v => set("channel", v)} /></Field>
        <Field label="Colour"><Swatches value={b.color} onChange={v => set("color", v)} /></Field>
        <div className="two">
          <Field label="Keyboard key">
            <input type="text" readOnly placeholder="Tap, then press a key"
              value={b.key ? (b.key === "space" ? "Space" : b.key.toUpperCase()) : ""}
              onKeyDown={e => { if (e.key === "Tab" || e.key === "Escape") return; e.preventDefault();
                set("key", (e.key === "Backspace" || e.key === "Delete") ? "" : e.key === " " ? "space" : e.key.toLowerCase()); }} />
          </Field>
          <Field label="Gamepad button">
            <select value={b.gamepad} onChange={e => set("gamepad", e.target.value)}>
              <option value="">None</option>{GP_BUTTONS.map(g => <option key={g} value={g}>{g}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Section">
          <select value={loc.s.id} onChange={e => toSection(e.target.value)}>
            {config.sections.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
          </select>
        </Field>
        <div className="actions">
          <button className="tb" onClick={() => move(-1)}>Move left</button>
          <button className="tb" onClick={() => move(1)}>Move right</button>
          <button className="tb" onClick={dup}>Duplicate</button>
          <button className="tb danger" onClick={del}>Delete</button>
        </div>
        <p className="help">Backspace in the key box clears it. Momentary sends off on release, toggle latches, trigger sends a short press.</p>
      </div>
    );
  }

  if (sel.kind === "fader") {
    const i = config.faders.findIndex(f => f.id === sel.id); if (i < 0) return null;
    const f = config.faders[i];
    const set = (k, v) => update(d => { const x = d.faders.find(x => x.id === sel.id); x[k] = v;
      if (k === "type") x.value = v === "pb" ? 8192 : 64; });
    const move = dir => update(d => { const j = i + dir; if (j < 0 || j >= d.faders.length) return; [d.faders[i], d.faders[j]] = [d.faders[j], d.faders[i]]; });
    return (
      <div className="drawer">
        <h3>Knob <button className="tb" onClick={close}>Close</button></h3>
        <Field label="Label"><input type="text" value={f.label} onChange={e => set("label", e.target.value)} /></Field>
        <div className="two">
          <Field label="Sends">
            <select value={f.type} onChange={e => set("type", e.target.value)}>
              <option value="cc">Control change</option><option value="pb">Pitch bend</option>
            </select>
          </Field>
          {f.type === "cc" && <Field label="CC number"><input type="number" min="0" max="127" value={f.cc} onChange={e => set("cc", num(e.target.value, 0, 127))} /></Field>}
        </div>
        <Field label="Channel"><ChannelSelect value={f.channel} onChange={v => set("channel", v)} /></Field>
        <Field label="Colour"><Swatches value={f.color || "sand"} onChange={v => set("color", v)} /></Field>
        <div className="two">
          <Field label="Gamepad axis">
            <select value={f.axis} onChange={e => set("axis", e.target.value)}>
              <option value="">None</option>{GP_AXES.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          <Field label="Invert axis">
            <select value={f.invert ? "1" : ""} onChange={e => set("invert", !!e.target.value)}>
              <option value="">No</option><option value="1">Yes</option>
            </select>
          </Field>
        </div>
        <div className="actions">
          <button className="tb" onClick={() => move(-1)}>Move left</button>
          <button className="tb" onClick={() => move(1)}>Move right</button>
          <button className="tb danger" onClick={() => { update(d => d.faders.splice(i, 1)); close(); }}>Delete</button>
        </div>
        <p className="help">Drag a knob up or right to raise it. Sticks spring back to centre, so they suit pan and pitch bend; triggers (LT/RT) suit mod or expression.</p>
      </div>
    );
  }

  if (sel.kind === "section") {
    const i = config.sections.findIndex(s => s.id === sel.id); if (i < 0) return null;
    const s = config.sections[i];
    const set = (k, v) => update(d => { d.sections[i][k] = v; });
    const move = dir => update(d => { const j = i + dir; if (j < 0 || j >= d.sections.length) return; [d.sections[i], d.sections[j]] = [d.sections[j], d.sections[i]]; });
    return (
      <div className="drawer">
        <h3>Section <button className="tb" onClick={close}>Close</button></h3>
        <Field label="Title"><input type="text" value={s.title} onChange={e => set("title", e.target.value)} /></Field>
        <div className="two">
          <Field label="Columns"><input type="number" min="1" max="16" value={s.cols} onChange={e => set("cols", num(e.target.value, 1, 16))} /></Field>
          <Field label="Rows (0 = auto)"><input type="number" min="0" max="16" value={s.rows || 0} onChange={e => set("rows", num(e.target.value, 0, 16))} /></Field>
        </div>
        <div className="two">
          <Field label="MIDI output"><OutputSelect value={s.outputName} outputs={outputs} onChange={v => set("outputName", v)} /></Field>
          <Field label="Channel"><ChannelSelect value={s.channel || 0} onChange={v => set("channel", v)} /></Field>
        </div>
        <Field label="Pad tabs">
          {(s.pages || []).map(p => {
            const count = s.items.filter(b => (b.pageId || s.pages[0].id) === p.id).length;
            return (
              <div className="pagecard" key={p.id}>
                <div className="two">
                  <input type="text" value={p.title} onChange={e => renamePage(s.id, p.id, e.target.value)} />
                  <button className="tb danger" disabled={s.pages.length <= 1}
                    onClick={() => { if (!count || confirm(`Delete tab "${p.title}" and its ${count} buttons?`)) deletePage(s.id, p.id); }}>Delete</button>
                </div>
                <div className="two">
                  <OutputSelect value={p.outputName} outputs={outputs} onChange={v => setPageField(s.id, p.id, "outputName", v)} />
                  <ChannelSelect value={p.channel || 0} onChange={v => setPageField(s.id, p.id, "channel", v)} />
                </div>
              </div>
            );
          })}
          <div className="two">
            <button className="tb" onClick={() => addPage(s.id)}>Add tab</button>
            <button className="tb" onClick={() => addHelixTab(s.id)}>Add Helix Native tab</button>
          </div>
        </Field>
        <div className="actions">
          <button className="tb" onClick={() => move(-1)}>Move up</button>
          <button className="tb" onClick={() => move(1)}>Move down</button>
          <button className="tb danger" onClick={() => { if (!s.items.length || confirm(`Delete “${s.title}” and its ${s.items.length} buttons?`)) { update(d => d.sections.splice(i, 1)); close(); } }}>Delete section</button>
        </div>
        <p className="help">Sections share the screen height by how many rows they have, so the deck always fills the display.</p>
        <p className="help">MIDI output and channel here are the section's fallback — used by any tab that leaves its own output/channel on "Global". A button's own Channel field overrides everything.</p>
        <p className="help">Pad tabs split a section's buttons into switchable pages — handy when you have more pads than fit on screen, or want each page on its own MIDI output/channel (e.g. a plugin tab routed to its own port). Tabs only show in the section header once there's more than one.</p>
      </div>
    );
  }

  if (sel.kind === "faderGroup") {
    const fg = config.faderGroup || { outputName: "", channel: 0 };
    const set = (k, v) => update(d => { if (!d.faderGroup) d.faderGroup = { outputName: "", channel: 0 }; d.faderGroup[k] = v; });
    return (
      <div className="drawer">
        <h3>Knobs <button className="tb" onClick={close}>Close</button></h3>
        <div className="two">
          <Field label="MIDI output"><OutputSelect value={fg.outputName} outputs={outputs} onChange={v => set("outputName", v)} /></Field>
          <Field label="Channel"><ChannelSelect value={fg.channel || 0} onChange={v => set("channel", v)} /></Field>
        </div>
        <p className="help">Sets the default output and channel for every knob in the strip. Each knob's own Channel field (in its editor) still overrides this.</p>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
